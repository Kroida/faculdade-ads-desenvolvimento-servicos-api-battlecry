services:
  mysql:
    image: mysql:8.4
    container_name: battlecry_mysql-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: battlecry_bd
      MYSQL_USER: battlecry_user
      MYSQL_PASSWORD: 1234

    ports:
      - "5432:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: